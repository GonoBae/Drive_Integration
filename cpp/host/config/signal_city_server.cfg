# Fictional local-ENU two-intersection signal-city course.
format_version=1
vehicle_config=vehicle_sedan.cfg
map_package=../../../map_packages/signal_city_v2
traffic_network=../../../map_packages/signal_city_v2/traffic_network.json
# Ten NPCs cycle sedan/compact/truck/motorcycle profiles, then choose reachable lanes.
npc_route=1010,1011,1014,3001,2020,2021,2024,3004
npc_alternate_route=1020,1021,1024,3002,2010,2011,2014,3003
npc_route_loop=true
npc_autonomous=true
# 19m keeps all ten starts outside the current route's controlled stop margins.
npc_start_offset_m=19
npc_max_speed_mps=6
npc_count=10
npc_spacing_m=90
ws_port=9000
physics_hz=60
origin_lat_deg=0
origin_lon_deg=0
origin_alt_m=0
spawn_heading_deg=0
command_timeout_ms=250
max_command_queue_age_ms=100
hard_command_timeout_ms=1000
source_id=simcore-signal-city
demo_entities=false
