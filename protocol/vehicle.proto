syntax = "proto3";

package simcore;

enum VehicleGear {
    VEHICLE_GEAR_NEUTRAL = 0;
    VEHICLE_GEAR_DRIVE = 1;
    VEHICLE_GEAR_REVERSE = 2;
}

enum ControlMode {
    CONTROL_MODE_MANUAL = 0;
    CONTROL_MODE_AUTONOMY = 1;
    CONTROL_MODE_ESTOP = 2;
}

// Additive R1 entity classification. Existing schema-v2 clients ignore these
// values and continue selecting the Ego by entity_id.
enum EntityKind {
    ENTITY_KIND_UNSPECIFIED = 0;
    ENTITY_KIND_EGO_VEHICLE = 1;
    ENTITY_KIND_NPC_VEHICLE = 2;
    ENTITY_KIND_PEDESTRIAN = 3;
}

enum VehicleDamageZone {
    VEHICLE_DAMAGE_ZONE_NONE = 0;
    VEHICLE_DAMAGE_ZONE_FRONT = 1;
    VEHICLE_DAMAGE_ZONE_REAR = 2;
    VEHICLE_DAMAGE_ZONE_LEFT = 3;
    VEHICLE_DAMAGE_ZONE_RIGHT = 4;
    VEHICLE_DAMAGE_ZONE_ROOF = 5;
    VEHICLE_DAMAGE_ZONE_UNDERBODY = 6;
}

message Vector3d {
    double x = 1;
    double y = 2;
    double z = 3;
}

message WheelState {
    uint32 wheel_index = 1; // 0=front-left, 1=front-right, 2=rear-left, 3=rear-right
    bool in_contact = 2;
    float steering_angle = 3; // wheel-local radians, positive = left
    float angular_speed = 4; // rad/s, signed in the vehicle's forward direction
    float normal_load = 5;
    float longitudinal_slip = 6;
    float slip_angle = 7; // wheel-local, positive = left
    float longitudinal_force = 8;
    float lateral_force = 9; // wheel-local, positive = left
    Vector3d contact_point_enu = 10; // true tire tangent patch in ENU meters
    Vector3d contact_normal_enu = 11; // upward unit surface normal at the patch
}

// 단일 엔티티 상태 (CIGI Entity State Packet 기반)
message EntityState {
    uint32 entity_id = 1;   // 엔티티 고유 ID
    double timestamp = 2;   // Unix timestamp (seconds)

    // 위치
    double lat      = 3;    // 위도 (degrees)
    double lon      = 4;    // 경도 (degrees)
    double alt      = 5;    // 고도 (meters)

    // 자세
    float heading   = 6;    // navigation heading (degrees, North=0, clockwise-positive)
    float pitch     = 7;    // schema-v2 Euler pitch (degrees), nose-up positive
    float roll      = 8;    // schema-v2 Euler roll (degrees), left-up positive

    // 동역학
    float speed     = 9;    // 속도 (m/s)
    float accel     = 10;   // 가속도 (m/s²)

    // 차량 상태
    float fuel      = 11;   // 연료량 (%)
    float rpm       = 12;   // RPM

    // 로컬 물리 좌표와 조향 상태
    double east          = 13; // Local ENU X (meters)
    double north         = 14; // Local ENU Y (meters)
    float yaw_rate       = 15; // true FLU angular-velocity Z component (rad/s), left-positive
    float steering_angle = 16; // road wheel angle (radians), positive = left
    VehicleGear gear     = 17;
    Vector3d position_enu = 18; // map_enu polar position: East, North, Up in meters
    Vector3d linear_velocity_body = 19;  // base_link polar: X forward, Y left, Z up, m/s
    Vector3d angular_velocity_body = 20; // base_link axial: X forward, Y left, Z up, rad/s
    repeated WheelState wheels = 21;

    // Additive runtime-entity presentation/collision metadata. Field numbers
    // 1~21 keep their schema-v2 meaning for backward wire compatibility.
    EntityKind entity_kind = 22;
    Vector3d linear_velocity_enu = 23; // map_enu polar velocity: East, North, Up, m/s
    float collision_half_length = 24;
    float collision_half_width = 25;
    float collision_half_height = 26;
    float collision_radius = 27;
    // Additive authoritative crash state. Damage is cumulative until reset;
    // event_sequence changes only for a newly accepted damaging impact.
    float damage_percent = 28;
    float last_impact_impulse_n_s = 29;
    VehicleDamageZone damage_zone = 30;
    uint32 collision_event_sequence = 31;
}

// 여러 엔티티를 한 패킷에 담을 때 사용
message EntityStatePacket {
    repeated EntityState entities = 1;
}

enum TrafficSignalAspect {
    TRAFFIC_SIGNAL_UNKNOWN = 0;
    TRAFFIC_SIGNAL_RED = 1;
    TRAFFIC_SIGNAL_YELLOW = 2;
    TRAFFIC_SIGNAL_GREEN = 3;
}

enum TrafficSignalKind {
    TRAFFIC_SIGNAL_KIND_UNSPECIFIED = 0;
    TRAFFIC_SIGNAL_KIND_VEHICLE = 1;
    TRAFFIC_SIGNAL_KIND_PEDESTRIAN = 2;
}

// Server authority. Position is the visual pole base in map-local ENU meters;
// heading is the controlled travel direction, not the lens-facing direction.
message TrafficSignalState {
    uint32 signal_id = 1;
    uint32 group_id = 2;
    TrafficSignalAspect aspect = 3;
    Vector3d position_enu = 4;
    float heading_deg = 5;
    float remaining_seconds = 6;
    // Additive multi-intersection identity. Legacy traffic-signals.v1 snapshots
    // belong to controller 1.
    uint32 controller_id = 7;
    // Additive presentation/control role. Omitted legacy snapshots are treated
    // as vehicle heads by schema-v2 clients.
    TrafficSignalKind signal_kind = 8;
}

message WorldState {
    repeated EntityState entities = 1;
    // Additive world-health.v1 capability. Health and pose share one sequence,
    // map identity and latest-wins queue slot; a separate Health frame could
    // otherwise replace the WorldState it describes under backpressure.
    Health health = 2;
    // Optional traffic-signals.v1; shares pose/health sequence and lifecycle.
    repeated TrafficSignalState traffic_signals = 3;
    string traffic_network_checksum = 4;
}

message ControlCommand {
    ControlMode mode = 1;
    float throttle = 2;      // 0 ~ 1
    float brake = 3;         // 0 ~ 1
    float steering = 4;      // -1(right) ~ 1(left), canonical FLU contract
    bool handbrake = 5;
    optional VehicleGear gear = 6;
    bool estop = 7;
    uint64 client_time_ns = 8;
}

message Hello {
    string build = 1;
    string schema = 2;
    repeated string capabilities = 3;
}

message Health {
    // awaiting_reset, awaiting_control, active, safe_stop,
    // reconnect_required, or estop_latched. This is server authority, not a
    // client-side connection/freshness estimate.
    string status = 1;
    uint32 tick_overrun_count = 2;
    uint64 last_command_age_ns = 3;
    string message = 4;
    // False before the first accepted ordinary command after reset/reconnect.
    // In that case last_command_age_ns is zero, not an unavailable sentinel.
    bool has_control_command = 5;
}

// Requests that the authoritative simulation return to its configured spawn.
// play_session_id is stable across reconnects within one Unreal PIE run, so
// retransmission is safe and a new PIE run remains distinguishable.
message SimulationReset {
    string play_session_id = 1;
    uint64 client_time_ns = 2;
}

message Envelope {
    uint32 schema_version = 1; // must be 2 for the left-positive FLU scalar contract
    uint64 sequence = 2;
    uint64 simulation_time_ns = 3;
    string source_id = 4;
    string map_package_checksum = 5;
    string session_id = 6; // unique for each controller connection/process lifetime
    string play_session_id = 7; // authoritative PIE identity echoed on WorldState

    oneof payload {
        Hello hello = 10;
        ControlCommand control_command = 11;
        WorldState world_state = 12;
        Health health = 13;
        SimulationReset simulation_reset = 14;
    }
}
