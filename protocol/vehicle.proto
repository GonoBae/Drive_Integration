syntax = "proto3";

package simcore;

enum VehicleGear {
    VEHICLE_GEAR_NEUTRAL = 0;
    VEHICLE_GEAR_DRIVE = 1;
    VEHICLE_GEAR_REVERSE = 2;
}

enum ControlMode {
    CONTROL_MODE_MANUAL = 0;
    CONTROL_MODE_AUTONOMY = 1;
    CONTROL_MODE_ESTOP = 2;
}

message Vector3d {
    double x = 1;
    double y = 2;
    double z = 3;
}

message WheelState {
    uint32 wheel_index = 1;
    bool in_contact = 2;
    float steering_angle = 3;
    float angular_speed = 4;
    float normal_load = 5;
    float longitudinal_slip = 6;
    float slip_angle = 7;
    float longitudinal_force = 8;
    float lateral_force = 9;
    Vector3d contact_point_enu = 10;
    Vector3d contact_normal_enu = 11;
}

// 단일 엔티티 상태 (CIGI Entity State Packet 기반)
message EntityState {
    uint32 entity_id = 1;   // 엔티티 고유 ID
    double timestamp = 2;   // Unix timestamp (seconds)

    // 위치
    double lat      = 3;    // 위도 (degrees)
    double lon      = 4;    // 경도 (degrees)
    double alt      = 5;    // 고도 (meters)

    // 자세
    float heading   = 6;    // 방향각 (degrees, 0~360)
    float pitch     = 7;    // 피치각 (degrees)
    float roll      = 8;    // 롤각 (degrees)

    // 동역학
    float speed     = 9;    // 속도 (m/s)
    float accel     = 10;   // 가속도 (m/s²)

    // 차량 상태
    float fuel      = 11;   // 연료량 (%)
    float rpm       = 12;   // RPM

    // 로컬 물리 좌표와 조향 상태
    double east          = 13; // Local ENU X (meters)
    double north         = 14; // Local ENU Y (meters)
    float yaw_rate       = 15; // rad/s, positive = right turn
    float steering_angle = 16; // road wheel angle (radians)
    VehicleGear gear     = 17;
    Vector3d position_enu = 18;
    Vector3d linear_velocity_body = 19;
    Vector3d angular_velocity_body = 20;
    repeated WheelState wheels = 21;
}

// 여러 엔티티를 한 패킷에 담을 때 사용
message EntityStatePacket {
    repeated EntityState entities = 1;
}

message WorldState {
    repeated EntityState entities = 1;
}

message ControlCommand {
    ControlMode mode = 1;
    float throttle = 2;      // 0 ~ 1
    float brake = 3;         // 0 ~ 1
    float steering = 4;      // -1(left) ~ 1(right)
    bool handbrake = 5;
    optional VehicleGear gear = 6;
    bool estop = 7;
    uint64 client_time_ns = 8;
}

message Hello {
    string build = 1;
    string schema = 2;
    repeated string capabilities = 3;
}

message Health {
    string status = 1;
    uint32 tick_overrun_count = 2;
    uint64 last_command_age_ns = 3;
    string message = 4;
}

message Envelope {
    uint32 schema_version = 1;
    uint64 sequence = 2;
    uint64 simulation_time_ns = 3;
    string source_id = 4;
    string map_package_checksum = 5;

    oneof payload {
        Hello hello = 10;
        ControlCommand control_command = 11;
        WorldState world_state = 12;
        Health health = 13;
    }
}
