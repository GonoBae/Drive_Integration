<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">부품을 고르는 것과 적용하는 것은 다릅니다</title><desc id="desc">현재 동작 · 부품 선택은 G / Tab, 적용은 정차 후 Enter</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">부품을 고르는 것과 적용하는 것은 다릅니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">현재 동작 · 부품 선택은 G / Tab, 적용은 정차 후 Enter</text>
<rect x="32" y="124" width="265" height="150" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="161" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">① 부품 선택</text><text x="54" y="196" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">G → 조합 선택 → Tab</text><text x="54" y="225" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">방향키로 장착 부품 편집</text><rect x="348" y="124" width="265" height="150" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="370" y="161" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">② 정차 후 Enter</text><text x="370" y="196" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">함께 쓸 수 있는지 검사</text><text x="370" y="225" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">새 주행으로 다시 시작</text><rect x="664" y="124" width="264" height="150" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="686" y="161" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">③ 적용된 주행</text><text x="686" y="196" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">출발점에서 다시 시작</text><text x="686" y="225" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">같은 차종 NPC에도 반영</text><path d="M 297 194 H 348" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 613 194 H 664" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="357" width="402" height="127" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="394" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">적용 전 닫기 / 편집 나가기</text><text x="54" y="429" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">적용하지 않은 선택은 취소합니다.</text><text x="54" y="458" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">현재 주행은 바꾸지 않습니다.</text><rect x="498" y="357" width="430" height="127" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="520" y="394" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">현재 주행 중 다시 연결</text><text x="520" y="429" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">위치 · 손상 · 선택 조합을 유지합니다.</text><text x="520" y="458" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">새 주행을 시작하는 동작과 다릅니다.</text><text x="32" y="531" font-size="19" fill="#a9650a" font-weight="400" text-anchor="start">주행 중 부품만 즉시 갈아 끼우거나, 사용자 조합을 파일로 저장하는 기능은 아닙니다.</text></g></svg>
