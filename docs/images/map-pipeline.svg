<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">맵을 고치면 지면과 교통 데이터를 함께 맞춥니다</title><desc id="desc">현재 작업 순서 · 기본 맵을 플레이할 때는 데이터를 다시 내보내지 않아도 됩니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">맵을 고치면 지면과 교통 데이터를 함께 맞춥니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">현재 작업 순서 · 기본 맵을 플레이할 때는 데이터를 다시 내보내지 않아도 됩니다</text>
<rect x="32" y="127" width="265" height="150" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="164" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">① Unreal 맵 저장</text><text x="54" y="199" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">도로 · 보도 · 연석 · 구조물</text><text x="54" y="228" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">하나의 도로 설계 사용</text><rect x="348" y="127" width="265" height="150" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="370" y="164" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">② 지면 내보내기</text><text x="370" y="199" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">지면 높이 · 기울기 · 재질</text><text x="370" y="228" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">장애물 + 파일 목록</text><rect x="664" y="127" width="264" height="150" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="686" y="164" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">③ 교통 내보내기</text><text x="686" y="199" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">차선 연결 · 신호 계획</text><text x="686" y="228" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">지면 데이터 일치 확인</text><path d="M 297 202 H 348" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 613 202 H 664" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 796 277 V 322 H 164 V 364" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="364" width="412" height="127" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="401" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">④ 데이터 검사</text><text x="54" y="436" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">맵·충돌·교통의 일치 여부 검사</text><text x="54" y="465" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">실제 주행 확인은 별도로 필요</text><rect x="518" y="364" width="410" height="127" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="540" y="401" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">⑤ 적용 후 플레이</text><text x="540" y="436" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">검사한 데이터를 계산 사이에 교체</text><text x="540" y="465" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">다시 연결한 뒤 새 주행 시작 확인</text><path d="M 444 427 H 518" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><text x="32" y="539" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">파일이 완전하고 서로 일치할 때만 적용합니다. 실제 내용 없이 식별값만 바꾸면 안 됩니다.</text></g></svg>
