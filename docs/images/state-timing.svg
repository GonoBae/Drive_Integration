<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">데이터를 받은 시간과 화면에 보이는 시간은 다릅니다</title><desc id="desc">개념도 · 간격은 실제 측정값이 아닙니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="570" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">데이터를 받은 시간과 화면에 보이는 시간은 다릅니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">개념도 · 간격은 실제 측정값이 아닙니다</text>
<text x="32" y="132" font-size="23" fill="#2563eb" font-weight="700" text-anchor="start">현재</text><text x="158" y="132" font-size="23" fill="#172d43" font-weight="700" text-anchor="start">마지막 상태로 현재 위치를 추정</text><path d="M 162 202 H 908" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><circle cx="334" cy="202" r="9" fill="#2563eb"/><circle cx="666" cy="202" r="9" fill="#087d77"/><text x="334" y="176" font-size="20" fill="#2563eb" font-weight="600" text-anchor="middle">마지막 정상 상태를 받음</text><text x="666" y="176" font-size="20" fill="#087d77" font-weight="600" text-anchor="middle">현재 화면 표시</text><path d="M 334 222 V 246 H 666 V 222" fill="none" stroke="#2563eb" stroke-width="2"/><text x="500" y="280" font-size="20" fill="#2563eb" font-weight="400" text-anchor="middle">마지막 수신 후 지난 시간</text><text x="162" y="322" font-size="20" fill="#172d43" font-weight="600" text-anchor="start">화면 예측은 최대 50ms / 상태를 오래됐다고 보는 기준은 100ms (기본값)</text><path d="M 32 353 H 928" stroke="#cbd7e1" stroke-width="2"/><text x="32" y="391" font-size="23" fill="#a9650a" font-weight="700" text-anchor="start">연구</text><text x="158" y="391" font-size="23" fill="#172d43" font-weight="700" text-anchor="start">과거 두 상태 사이의 위치를 계산</text><path d="M 162 431 H 908" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><circle cx="330" cy="431" r="7" fill="#a9650a"/><circle cx="480" cy="431" r="7" fill="#a9650a"/><circle cx="630" cy="431" r="7" fill="#a9650a"/><circle cx="780" cy="431" r="7" fill="#a9650a"/><path d="M 555 407 V 455" stroke="#a9650a" stroke-width="3"/><text x="555" y="487" font-size="19" fill="#a9650a" font-weight="600" text-anchor="middle">조금 이전 시점의 움직임을 표시</text><text x="780" y="487" font-size="19" fill="#50677c" font-weight="400" text-anchor="middle">현재</text><text x="32" y="540" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">아래 방식은 연구 계획입니다. 통신 왕복 시간과 키 입력 후 화면 반응도 따로 측정합니다.</text></g></svg>
