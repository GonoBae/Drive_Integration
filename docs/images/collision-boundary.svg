<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">충돌 계산과 눈에 보이는 파손을 분리합니다</title><desc id="desc">현재 동작 · 화면의 차체가 찌그러져도 서버의 충돌 범위가 똑같이 변하지는 않습니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">충돌 계산과 눈에 보이는 파손을 분리합니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">현재 동작 · 화면의 차체가 찌그러져도 서버의 충돌 범위가 똑같이 변하지는 않습니다</text>
<rect x="32" y="123" width="412" height="253" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="54" y="160" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">C++ 서버가 결정</text><text x="54" y="195" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">차체 충돌 범위 · 접촉 위치 · 충격</text><text x="54" y="224" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">차량 반작용 · 사고 상태 · 손상</text><text x="54" y="253" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">사람 몸통 이동 · 중력 · 지면 접촉</text><text x="54" y="282" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">신호등 쓰러짐 · 충돌 범위</text><rect x="518" y="123" width="410" height="253" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="540" y="160" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">Unreal이 표시</text><text x="540" y="195" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">부딪힌 곳의 차체 모양 변경</text><text x="540" y="224" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">물리로 흔들리는 사람의 팔다리</text><text x="540" y="253" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">파편 · 손상 흔적 · 캐릭터 자세</text><text x="540" y="282" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">신호등의 쓰러진 모습</text><path d="M 444 241 H 518" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="417" width="896" height="82" rx="14" fill="#fff" stroke="#cbd7e1" stroke-width="1.5"/><text x="56" y="451" font-size="21" fill="#172d43" font-weight="600" text-anchor="start">화면의 파편은 서버 차량에 힘을 주지 않습니다.</text><text x="56" y="480" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">금속 파괴·서버의 사람 전신 관절 계산·건물 전체 붕괴는 구현하지 않았습니다.</text><text x="32" y="543" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">F3 충돌 범위와 실제 화면을 함께 확인하고 정면·측면·모서리 충돌을 각각 비교합니다.</text></g></svg>
