<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" role="img" aria-labelledby="title desc">
<title id="title">주행 장면을 다시 보기 / 움직임을 다시 계산하기</title><desc id="desc">현재 구현 · 두 기록은 목적도, 필요한 데이터도 다릅니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="585" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">주행 장면을 다시 보기 / 움직임을 다시 계산하기</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">현재 구현 · 두 기록은 목적도, 필요한 데이터도 다릅니다</text>
<rect x="32" y="130" width="270" height="161" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="167" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">Unreal 주행 기록</text><text x="54" y="202" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">R: 상태를 CSV로 저장</text><text x="54" y="231" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">차종 · 부품 조합 ID 포함</text><path d="M 302 210 H 392" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="392" y="130" width="536" height="161" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="414" y="167" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">F6: 기록된 차량 움직임 표시</text><text x="414" y="202" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">저장 상태를 이용해 주행 장면을 확인합니다.</text><text x="414" y="231" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">서버 물리나 NPC 판단을 다시 계산하지 않습니다.</text><rect x="32" y="344" width="270" height="161" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="54" y="381" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">서버 물리 기록</text><text x="54" y="416" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">계산 단계마다 적용한 입력</text><text x="54" y="445" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">주변 충돌체 · 주행 초기화</text><path d="M 302 424 H 392" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="392" y="344" width="536" height="161" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="414" y="381" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">같은 물리 코드로 다시 계산</text><text x="414" y="416" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">실행 파일·맵·부품·계산 주기를 맞춰 비교합니다.</text><text x="414" y="445" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">플레이어 차량만 재계산합니다. 교통 AI 전체는 아닙니다.</text><text x="32" y="552" font-size="19" fill="#a9650a" font-weight="400" text-anchor="start">초당 5~10번 저장한 분석 로그로는 매 계산 단계의 입력을 대신할 수 없습니다.</text></g></svg>
