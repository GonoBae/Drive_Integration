<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">NPC는 통과 공간을 확인한 뒤 우회합니다</title><desc id="desc">현재 판단 순서 · 카메라 영상 대신 도로·장애물 위치와 차량 크기를 사용합니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">NPC는 통과 공간을 확인한 뒤 우회합니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">현재 판단 순서 · 카메라 영상 대신 도로·장애물 위치와 차량 크기를 사용합니다</text>
<rect x="32" y="130" width="253" height="142" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="167" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">앞길 막힘 확인</text><text x="54" y="202" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">신호 대기와 사고 구분</text><text x="54" y="231" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">사고 대상에게 경적 없음</text><rect x="353" y="130" width="266" height="142" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="375" y="167" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">안전하게 통과?</text><text x="375" y="202" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">같은 방향 차선 변경</text><text x="375" y="231" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">주변 도로의 짧은 우회</text><rect x="696" y="130" width="232" height="142" rx="14" fill="#e7f6f3" stroke="#087d77" stroke-width="1.5"/><text x="718" y="167" font-size="24" fill="#087d77" font-weight="700" text-anchor="start">우회 주행</text><text x="718" y="202" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">이동 중에도 다시 검사</text><text x="718" y="231" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">중앙선 침범 금지</text><path d="M 285 201 H 353" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 619 201 H 696" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><text x="658" y="181" font-size="18" fill="#087d77" font-weight="400" text-anchor="middle">있음</text><path d="M 486 272 V 348" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><text x="506" y="320" font-size="18" fill="#a9650a" font-weight="400" text-anchor="start">없음</text><rect x="353" y="348" width="266" height="142" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="375" y="385" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">후진 공간 확인</text><text x="375" y="420" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">후방 안전할 때만 이동</text><text x="375" y="449" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">0.5m씩 이동 후 재판단</text><rect x="696" y="348" width="232" height="142" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="718" y="385" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">대기</text><text x="718" y="420" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">뒤가 막힘 / 범위 밖</text><text x="718" y="449" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">무리한 통과 없음</text><path d="M 619 419 H 696" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><text x="658" y="398" font-size="18" fill="#a9650a" font-weight="400" text-anchor="middle">불가</text><path d="M 353 419 H 162 V 311 H 392 V 272" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><text x="32" y="462" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">후진한 뒤 다시 판단</text><text x="32" y="538" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">차량 크기와 회전 반경을 확인합니다. 정해진 최대 거리까지 무조건 후진하지는 않습니다.</text></g></svg>
