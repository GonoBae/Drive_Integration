<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">먼저 측정하고, 필요한 기능을 추가합니다</title><desc id="desc">연구 계획 · 비교 실험, 별도 로그 저장, DB 화면은 아직 완료하지 않았습니다</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50677c"/></marker></defs>
<rect width="960" height="560" rx="16" fill="#f8fafc"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<text x="32" y="48" font-size="30" fill="#172d43" font-weight="700" text-anchor="start">먼저 측정하고, 필요한 기능을 추가합니다</text><text x="32" y="81" font-size="18" fill="#50677c" font-weight="400" text-anchor="start">연구 계획 · 비교 실험, 별도 로그 저장, DB 화면은 아직 완료하지 않았습니다</text>
<rect x="32" y="128" width="265" height="137" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="54" y="165" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">① 같은 조건 준비</text><text x="54" y="200" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">맵 · 부품 · 입력 · 카메라</text><text x="54" y="229" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">현재 로그와 영상 확보</text><rect x="348" y="128" width="265" height="137" rx="14" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5"/><text x="370" y="165" font-size="24" fill="#2563eb" font-weight="700" text-anchor="start">② 측정 기능 추가</text><text x="370" y="200" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">시간 · 주행 ID · 순번 연결</text><text x="370" y="229" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">지연 · 위치 수정 · 누락</text><rect x="664" y="128" width="264" height="137" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="686" y="165" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">③ 표시 방식 비교</text><text x="686" y="200" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">현재 방식 ↔ 비교할 방식</text><text x="686" y="229" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">반응 속도와 부드러움 비교</text><path d="M 297 197 H 348" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 613 197 H 664" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 796 265 V 310 H 164 V 356" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="356" width="265" height="137" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="54" y="393" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">④ 로그·복구 비교</text><text x="54" y="428" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">저장 지연 · 연결 끊김 시험</text><text x="54" y="457" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">큐 크기 제한 · 별도 저장</text><rect x="348" y="356" width="265" height="137" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="370" y="393" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">⑤ PC에서 분석</text><text x="370" y="428" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">측정 로그 → 파일 / SQL</text><text x="370" y="457" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">결과 · 실패 · 한계 정리</text><rect x="664" y="356" width="264" height="137" rx="14" fill="#fff4de" stroke="#a9650a" stroke-width="1.5"/><text x="686" y="393" font-size="24" fill="#a9650a" font-weight="700" text-anchor="start">필요할 때만 확장</text><text x="686" y="428" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">PostgreSQL · Grafana</text><text x="686" y="457" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">Docker · 클라우드</text><path d="M 297 425 H 348" fill="none" stroke="#50677c" stroke-width="2.5" marker-end="url(#a)"/><path d="M 613 425 H 664" fill="none" stroke="#50677c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="32" y="538" font-size="19" fill="#50677c" font-weight="400" text-anchor="start">먼저 파일로 측정할 수 있습니다. DB는 필요할 때 추가하며 차량 계산은 같은 PC에서 합니다.</text></g></svg>
